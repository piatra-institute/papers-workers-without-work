  - id: distributed-decommissioning
    kind: definition
    passage: "*Distributed decommissioning* names the withdrawal of working arrangements by different actors, on different schedules, without a common settlement for the animals left outside them."
    rationale: "A proposed historical process, not a universal demographic law. Its application draws together cases whose population histories are not fully reconstructed."
  - id: comparative-arrangements
    kind: interpretation
    passage: "Ending work, transferring custody and ending obligation are separate decisions."
    rationale: "The historical cases distinguish decisions about work, custody and duties. They do not identify a two-variable causal law or demonstrate the welfare success of any arrangement."
  - id: rival-ecology
    kind: interpretation
    passage: "Their survival depends on food, nesting sites and their own capacities, not simply on the loss of a job."
    rationale: "Institutional and ecological explanations address different parts of the problem. The historical comparison does not estimate their relative causal contributions."
  - id: feral-nonspace
    kind: definition
    passage: "a site that supports animal habitation while its managers treat that habitation as unauthorized."
    rationale: "A term for conflicting uses and permissions. It neither derives a new metric of infrastructure nor implies that every exclusion is unjustified."
  - id: loft-proposal
    kind: normative
    passage: "A managed loft is one possible way to make such a claim administratively visible."
    rationale: "A proposal about where to exercise responsibility, not an established population-control or welfare effect. The next paragraphs specify empirical evaluation requirements."
  - id: responsibility-bridge
    kind: normative
    passage: "The ethical premise taken up here is that lives shaped around an institution's purposes cannot become irrelevant to its decisions merely because those purposes change."
    rationale: "An explicitly ethical premise, not a finding derived from population counts or a claim that historical use fixes every present obligation. The following sentences distinguish past involvement from present responsibility and competing interests."
  - id: reuter-retirement
    kind: source
    passage: "It made no corresponding promise of retirement."
    evidence:
      citation_id: "reuter1850"
      locator: "Complete contract transcription, clauses 1–10"
      verified: true
      verification_note: "The museum transcription contains supply, dispatch, secrecy, fees, lost-bird and term provisions, but no retirement promise. The next manuscript sentence explicitly warns that documentary silence does not prove abandonment."
      url: "https://onlinesammlung.museumsstiftung.de/detail/collection/8b1cf3a8-5916-4fc7-87b4-de47ccde8ed6"
  - id: membership
    kind: definition
    passage: "Membership, in this limited sense, means a standing claim to consideration in decisions about a shared place."
    rationale: "A deliberately limited normative use of membership. It is not a claim that pigeons already possess legal citizenship, that denizenship equals citizenship, or that residence authorizes every use of every site."
  - id: care-without-replacement-work
    kind: normative
    passage: "A continuing claim would matter precisely when no replacement task could be found."
    rationale: "Distinguishes recognition from successful reassignment to another use. It proposes a ground for continuing consideration; it neither forecasts job displacement nor supplies empirical evidence about labour markets."
  - id: usefulness-and-membership
    kind: normative
    passage: "Usefulness can end before membership does."
    rationale: "The concluding principle follows the paper's limited definition and ethical premise. It is not a prediction, an assertion of current legal rights, or a direct equivalence between human and animal histories."
