abstract: 'The end of a useful function leaves the lives organized around it unfinished. Pigeons make
  this mismatch unusually visible: their capacities for homing, reproduction and life near people survived
  the decline of many institutions that had employed them. This paper follows the withdrawal of those
  institutions through histories of pigeon keeping, disposal records, animal retirement statutes and urban
  control literature. It calls their uneven retreat *distributed decommissioning*. Comparisons with horses,
  military dogs and research chimpanzees distinguish the power to dispose of a worker from the acceptance
  of responsibility after work. Sale, adoption, sanctuary and protection of unowned populations offer
  different settlements; none can be inferred from the disappearance of a task alone. The pigeon case
  also shows how a capacity once valued as a service can become an objection to its bearer''s continued
  presence. Ecology and material harms matter to this process, but neither population counts nor control
  costs settle the question of obligation. The argument turns on the difference between arranging another
  use for an animal and recognizing a claim that no longer depends on its usefulness.'
