abstract: 'When an institution stops needing an animal''s work, the lives organized around that work continue.
  Pigeons show the mismatch clearly: their capacities for homing, reproduction and life near people outlasted
  many of the institutions that employed them. We trace the withdrawal of those institutions through histories
  of pigeon keeping, disposal records, animal retirement statutes and the urban control literature, and
  call their uneven retreat *distributed decommissioning*. Comparisons with horses, military dogs and
  research chimpanzees separate the power to dispose of a worker from the acceptance of responsibility
  after work. Sale, adoption, sanctuary and statutory protection of unowned populations are distinct settlements,
  and the disappearance of a task determines none of them. The pigeon record also shows a capacity once
  valued as a service, reliable homing, becoming an objection to the continued presence of the birds that
  have it. Ecology and material harms shape this process, yet neither population counts nor control costs
  settle the question of obligation. The argument rests on the difference between arranging another use
  for an animal and recognizing a claim that no longer depends on its usefulness.'
web_blurb: Pigeons outlived many of the institutions that employed them. Comparing their uneven decommissioning
  with retired horses, military dogs and research chimpanzees separates the power to dispose of a working
  animal from responsibility for it after work.
